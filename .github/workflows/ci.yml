name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Structural checks
        run: node scripts/validate-kit.mjs

      - name: Kit index and catalog are up to date
        run: node scripts/generate-index.mjs --check

      - name: Seed is up to date
        run: node scripts/build-seed.mjs --check

      - name: Hook and gate scripts parse
        run: for f in .claude/hooks/*.mjs .claude/hooks/*/*.mjs .claude/scripts/*.mjs .claude/scripts/*/*.mjs .claude/praxis/*.mjs scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done
